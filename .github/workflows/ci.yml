# CI — runs on every PR and push to main.
#
# Checks:
#   1. TypeScript strict type check
#   2. All tests pass
#   3. Build succeeds
#   4. Zero runtime dependencies (supply chain security)
#   5. Version consistency (version >= platformVersion, digest pins)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Dev tooling (vite 7 under vitest) needs 20.19+, so the test matrix
        # starts there; the node-floor job runs the built CLI on the floor.
        node-version: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dev dependencies
        run: npm ci

      - name: Type check (strict)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # The built CLI on the oldest supported Node (MIN_NODE, 20.12.0) runs, and
  # on an older one (18) it refuses before any command with a clear message.
  node-floor:
    runs-on: ubuntu-latest
    name: Node floor (20.12.0 runs, 18 refuses)
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 (build)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Build
        run: npm ci && npm run build

      - name: Setup Node.js 20.12.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20.12.0"

      - name: Built CLI runs on the floor
        run: |
          node --version
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

      - name: Setup Node.js 18
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "18"

      - name: Built CLI refuses Node 18 before any command
        run: |
          node --version
          for args in "" "init --yes --skip-github" "status" "reset" "--help"; do
            set +e
            out=$(node dist/cli.js $args 2>&1 < /dev/null)
            code=$?
            set -e
            echo "[$args] exit=$code"
            [ "$code" -eq 1 ] || { echo "expected exit 1"; exit 1; }
            echo "$out" | grep -q "needs Node 20.12 or newer" || { echo "missing message: $out"; exit 1; }
          done
          [ ! -e "$HOME/.syntropic137" ] || { echo "init touched the install dir"; exit 1; }

  zero-deps:
    runs-on: ubuntu-latest
    name: Zero runtime dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify no runtime dependencies
        run: |
          # Extract the dependencies field from package.json
          deps=$(node -e "
            const pkg = require('./package.json');
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error('FAIL: Found runtime dependencies:', deps.join(', '));
              console.error('This package must have zero runtime dependencies (stdlib only).');
              console.error('See SECURITY.md for rationale.');
              process.exit(1);
            }
            console.log('OK: Zero runtime dependencies');
          ")
          echo "$deps"

  consistency:
    runs-on: ubuntu-latest
    name: Version consistency
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version >= platformVersion
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLATFORM=$(node -p "require('./package.json').syntropic137?.platformVersion || ''")

          if [ -z "$PLATFORM" ]; then
            echo "⚠️ No platformVersion set — skipping version comparison"
            exit 0
          fi

          echo "npm version:      $VERSION"
          echo "platform version: $PLATFORM"

          # Compare using node semver logic
          node -e "
            const v = '$VERSION'.split('.').map(Number);
            const p = '$PLATFORM'.split('.').map(Number);
            if (v[0] < p[0] || (v[0] === p[0] && v[1] < p[1]) || (v[0] === p[0] && v[1] === p[1] && v[2] < p[2])) {
              console.error('FAIL: version (' + '$VERSION' + ') < platformVersion (' + '$PLATFORM' + ')');
              process.exit(1);
            }
            console.log('OK: version >= platformVersion');
          "

      - name: Check digest pins in compose file
        run: |
          COMPOSE="templates/docker-compose.syntropic137.yaml"
          if [ ! -f "$COMPOSE" ]; then
            echo "⚠️ No compose file found — skipping digest check"
            exit 0
          fi

          # Check for floating tags on ghcr.io images
          if grep -E 'image:\s+ghcr\.io/.*:(latest|\$\{|v[0-9])' "$COMPOSE"; then
            echo "::error::Compose file contains floating image tags — must use @sha256: digest pins"
            exit 1
          fi

          echo "OK: All GHCR images use digest pins"

      - name: Verify image digests exist in registry
        run: |
          COMPOSE="templates/docker-compose.syntropic137.yaml"
          if [ ! -f "$COMPOSE" ]; then
            exit 0
          fi

          # Extract all ghcr.io image references with digest pins
          IMAGES=$(grep -oP 'ghcr\.io/[^\s]+@sha256:[a-f0-9]+' "$COMPOSE" || true)
          if [ -z "$IMAGES" ]; then
            echo "No digest-pinned GHCR images found — skipping registry check"
            exit 0
          fi

          FAILED=0

          # Use process substitution to avoid subshell (so FAILED propagates)
          while read -r IMAGE; do
            REPO="${IMAGE%%@*}"
            DIGEST="${IMAGE##*@}"
            # Strip ghcr.io/ prefix for the API path
            API_PATH="${REPO#ghcr.io/}"
            # ...and the tag, if the image is pinned as `name:tag@sha256:...`.
            # Both forms are legal and the upstream compose uses both: most
            # images are `name@sha256:...`, but minio is
            # `minio:RELEASE.2025-04-22T22-12-26Z@sha256:...`. Leaving the tag
            # in produced the scope `repository:ns/minio:RELEASE...:pull`,
            # which GHCR rejects, so the token response had no `.token` and the
            # node one-liner below died on `write(undefined)` - a crash in the
            # middle of the loop, not a reported digest failure.
            API_PATH="${API_PATH%%:*}"

            # GHCR requires an auth token even for public images.
            # Fail loudly if the response carries no token: writing `undefined`
            # throws an opaque ERR_INVALID_ARG_TYPE that names nothing about
            # the image or the scope that caused it.
            TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:${API_PATH}:pull" | \
              node -e "
                const r = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                if (!r.token) {
                  console.error('no token in GHCR response: ' + JSON.stringify(r));
                  process.exit(1);
                }
                process.stdout.write(r.token);
              ") || true

            if [ -z "$TOKEN" ]; then
              echo "::error::Could not obtain a GHCR token for ${API_PATH} (from ${IMAGE})"
              FAILED=1
              continue
            fi

            # Accept both single-arch manifests and multi-arch image indexes
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://ghcr.io/v2/${API_PATH}/manifests/${DIGEST}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json" \
              -H "Authorization: Bearer ${TOKEN}")

            if [ "$STATUS" = "200" ]; then
              echo "OK: ${API_PATH}@${DIGEST}"
            else
              echo "::error::Digest not found in registry: ${IMAGE} (HTTP ${STATUS})"
              FAILED=1
            fi
          done <<< "$IMAGES"

          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
